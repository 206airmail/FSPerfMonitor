<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light">
<title>SVS Performance Monitor · Game log</title><link rel="icon" href="/favicon.png" type="image/png"><link rel="stylesheet" href="/assets/styles.css">
<!-- The live game log (0.3; SVS look 0.5, #8). Design: design/log.html (Codex, SimVizion UI skill). Stream: GET /log/stream
     (server-sent events, batches {e, reset, gap, lines:[[seq,text,marker]]}; reconnects send Last-Event-ID, no line
     twice). Lines are always inserted as text, never as HTML. -->
</head>
<body class="log-page" data-page="log"><a class="skip" href="#main">Skip to content</a>
<header class="masthead"><div class="wrap header-inner"><a class="identity" href="/"><img src="/assets/logo-64.png" alt="" width="40" height="40"><div><div class="product">SVS Performance Monitor</div><div class="studio">SimVizion Studios</div></div></a><nav aria-label="Main navigation"><a id="nav-group" hidden>Group</a><a href="./">Dashboard</a><a href="log" aria-current="page">Game log</a><a href="/settings">Settings</a></nav></div></header>
<main id="main" class="wrap"><div class="page-title"><h1>Game log</h1><span class="status" id="log-status" role="status"></span></div>
<div class="log-tools"><div class="field" id="src-field" hidden><label for="src" class="small">Log</label><select id="src" aria-describedby="src-help"></select><span id="src-help" class="meta">The game’s log, or FSPluginHost’s and its plugins’ logs.</span></div>
<label for="filter" class="small">Find text in the log</label><input id="filter" type="search" placeholder="Filter lines…" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="row between"><div class="filters"><button id="bErr" aria-pressed="false">Errors</button><button id="bWarn" aria-pressed="false">Warnings</button><button id="bFail" aria-pressed="false">FAIL</button></div><div class="actions"><button id="pause" aria-pressed="false">Pause</button><button id="clear">Clear</button><a class="button" id="download" href="log/download" download title="Save the lines kept for this log as a text file">Download</a></div></div>
<p class="meta">Selected levels are combined. Text ignores letter case. Clear affects this view only.</p>
<div id="full" class="row between" hidden><p class="small" id="full-status" role="status"></p><div class="actions"><button type="button" id="full-ask">Ask for the full logs</button><a class="button primary" id="full-dl" href="full-logs.zip" download hidden>Download full logs</a></div></div></div>
<div class="log-viewport" id="log" role="region" aria-label="Game log lines" tabindex="0"></div>
<div class="log-bottom"><span class="meta" id="log-count"></span><button class="primary" id="jump" hidden>Jump to live ↓</button></div></main>
<script>
"use strict";
const $ = id => document.getElementById(id);
// "Group" in the menu while this PC shares with a group: back to the group's pages (#14)
if (document.documentElement.dataset.relay !== "1") fetch("/api/settings", { cache: "no-store" }).then(r => r.json()).then(v => {
  const s = v.settings || {}, a = document.getElementById("nav-group");
  if (!a || !s.shareWithGroup || !s.groupAddress) return;
  try {
    const u = new URL(s.groupAddress.includes("://") ? s.groupAddress : "https://" + s.groupAddress);
    if (u.protocol !== "https:" && u.protocol !== "http:") return;
    a.href = u.origin + "/"; a.hidden = false;
  } catch { }
}).catch(() => { });
const KEEP = 10000, DOMCAP = 3000, PARAM_N = 500;
// #15: which log (game, FSPluginHost, a plugin): ?src= in this page's address, so a reload or a shared link keeps it
let src = new URLSearchParams(location.search).get("src") || "game";
function srcQuery() { return src === "game" ? "" : "&src=" + encodeURIComponent(src); }
const logEl = $("log");
let model = [];            // {seq, text, cls}; the last KEEP lines received
let held = [];             // lines that arrived while paused
let epoch = "", lastSeq = 0;
let paused = false, stick = true, lastId = "", connected = false, shownCount = 0;
const on = { err: false, warn: false, fail: false };
let needle = "";

// FAIL outranks Error, Warning, PASS (spec)
function classify(text, marker) {
  if (marker) return "marker";
  if (text.includes("FAIL")) return "fail";
  if (text.includes("Error") || text.includes("ERROR")) return "err";
  if (text.includes("Warning") || text.includes("WARNING")) return "warn";
  if (text.includes("PASS")) return "pass";
  return "";
}
function matches(m) {
  if (m.cls === "marker") return true;                   // markers always stay visible
  if (needle && !m.text.toLowerCase().includes(needle)) return false;
  if (on.err || on.warn || on.fail) return (on.err && m.cls === "err") || (on.warn && m.cls === "warn") || (on.fail && m.cls === "fail");
  return true;
}
const LABEL = { err: ["ERROR", "error"], warn: ["WARN", "warning"], fail: ["FAIL", "error"], pass: ["PASS", ""] };
function lineEl(m) {
  const d = document.createElement("div");
  d.className = "log-line" + (m.cls ? " " + m.cls : "");
  const lab = LABEL[m.cls];
  if (lab) { const s = document.createElement("span"); if (lab[1]) s.className = lab[1]; s.textContent = lab[0]; d.append(s, " "); }
  d.append(m.text === "" ? " " : m.text);               // text, never HTML
  return d;
}
function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40; }
function toBottom() { logEl.scrollTop = logEl.scrollHeight; }
function updateJump() { $("jump").hidden = stick || paused; }

function setStatus() {
  $("log-status").innerHTML = `<i class="dot ${connected ? "" : "wait"}" aria-hidden="true"></i>`;
  $("log-status").append((connected ? "Live" : "Reconnecting…") + (paused ? " · paused" + (held.length ? " (+" + held.length + ")" : "") : ""));
  $("log-count").textContent = `${model.length.toLocaleString()} lines · ${shownCount.toLocaleString()} shown`;
  $("pause").textContent = paused ? "Resume" + (held.length ? " (" + held.length + ")" : "") : "Pause";
  $("pause").setAttribute("aria-pressed", paused);
}

function emptyNote(text) { const p = document.createElement("p"); p.className = "meta"; p.id = "empty"; p.textContent = text; return p; }

function rebuild() {
  const vis = [];
  for (let i = model.length - 1; i >= 0 && vis.length < DOMCAP; i--) if (matches(model[i])) vis.push(model[i]);
  vis.reverse();
  logEl.textContent = "";
  if (!vis.length) logEl.appendChild(emptyNote(model.length ? "No lines match your filter." : "Waiting for lines…"));
  else { const frag = document.createDocumentFragment(); for (const m of vis) frag.appendChild(lineEl(m)); logEl.appendChild(frag); }
  shownCount = vis.length;
  if (stick) toBottom();
  setStatus();
}

function addLines(arr) {            // arr: [{seq,text,cls}], not paused
  if (!arr.length) return;
  for (const m of arr) model.push(m);
  if (model.length > KEEP) model.splice(0, model.length - KEEP);
  let add = arr.filter(matches);
  if (add.length > DOMCAP) add = add.slice(add.length - DOMCAP);   // never more nodes than the DOM cap (e.g. after a long pause)
  const empty = $("empty");
  if (empty && add.length) empty.remove();
  if (add.length) {
    // drop the oldest DOM lines first; when the user has scrolled up, keep the view where it was
    let over = logEl.children.length + add.length - DOMCAP;
    if (over > 0) {
      const h0 = logEl.scrollHeight;
      while (over-- > 0 && logEl.firstChild) logEl.removeChild(logEl.firstChild);
      if (!stick) logEl.scrollTop -= h0 - logEl.scrollHeight;
    }
    const frag = document.createDocumentFragment();
    for (const m of add) frag.appendChild(lineEl(m));
    logEl.appendChild(frag);
    shownCount = logEl.children.length;
    if (stick) toBottom();
  }
  setStatus();
}

function onBatch(b) {
  if (b.reset || b.e !== epoch) { epoch = b.e; lastSeq = 0; }
  if (b.reset) { model = []; held = []; stick = true; }
  const arr = [];
  if (b.gap) arr.push({ seq: 0, text: "Some lines were missed while this page was disconnected.", cls: "marker" });
  for (const l of b.lines) {
    if (l[0] <= lastSeq) continue;                 // already shown (reconnect overlap): dedupe by sequence within the epoch
    lastSeq = l[0];
    arr.push({ seq: l[0], text: l[1], cls: classify(l[1], l[2] === 1) });
  }
  if (!arr.length && !b.reset) return;
  // the game started again: clear the view and start fresh from the restart marker (Nick 2026-11-07)
  let mk = -1;
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].seq > 0 && arr[i].cls === "marker") { mk = i; break; }
  if (mk >= 0) { model = []; held = []; stick = true; rebuildWith(arr.slice(mk)); updateJump(); return; }
  if (b.reset) { rebuildWith(arr); return; }
  if (paused) { held.push(...arr); if (held.length > KEEP) held.splice(0, held.length - KEEP); setStatus(); }
  else addLines(arr);
}
function rebuildWith(arr) {
  for (const m of arr) model.push(m);
  if (model.length > KEEP) model.splice(0, model.length - KEEP);
  rebuild();
}

let es = null, retry = null;
function connect() {
  clearTimeout(retry);
  if (es) { es.close(); es = null; }
  es = new EventSource("log/stream?n=" + PARAM_N + srcQuery() + (lastId ? "&after=" + encodeURIComponent(lastId) : ""));
  es.onopen = () => { connected = true; setStatus(); };
  es.onmessage = e => {
    connected = true;
    if (e.lastEventId) lastId = e.lastEventId;
    try { onBatch(JSON.parse(e.data)); } catch (_) { }
  };
  es.onerror = () => {
    connected = false; setStatus();
    // the browser reconnects by itself (with Last-Event-ID); if it gave up (HTTP error), try again by hand
    if (es.readyState === 2) { es.close(); es = null; retry = setTimeout(connect, 3000); }
  };
}

logEl.addEventListener("scroll", () => { stick = atBottom(); updateJump(); }, { passive: true });
$("jump").onclick = () => { stick = true; toBottom(); updateJump(); };
function toggle(id, key) {
  $(id).onclick = () => { on[key] = !on[key]; $(id).setAttribute("aria-pressed", on[key]); rebuild(); updateJump(); };
}
toggle("bErr", "err"); toggle("bWarn", "warn"); toggle("bFail", "fail");
let ft = null;
$("filter").addEventListener("input", e => {
  clearTimeout(ft);
  ft = setTimeout(() => { needle = e.target.value.trim().toLowerCase(); rebuild(); }, 120);
});
$("pause").onclick = () => {
  paused = !paused;
  if (!paused && held.length) { const h = held; held = []; addLines(h); }
  setStatus(); updateJump();
};
$("clear").onclick = () => { model = []; held = []; rebuild(); };   // view only: the log file and the server are untouched
window.addEventListener("resize", () => { if (stick) toBottom(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !es) connect(); });
// the logs there are (relative: the group relay serves this page at /s/<id>/log); the picker shows when there is more than one
function setDownload() { $("download").href = "log/download" + (src === "game" ? "" : "?src=" + encodeURIComponent(src)); }
function switchTo(id) {
  src = id;
  const u = new URL(location.href);
  if (id === "game") u.searchParams.delete("src"); else u.searchParams.set("src", id);
  history.replaceState(null, "", u);
  const opt = [...$("src").options].find(o => o.value === id);
  document.querySelector("h1").textContent = opt ? opt.textContent : "Game log";
  $("log").setAttribute("aria-label", (opt ? opt.textContent : "Game log") + " lines");
  model = []; held = []; epoch = ""; lastSeq = 0; lastId = ""; stick = true;
  setDownload(); rebuild(); connect();
}
async function loadSources() {
  try {
    const list = await (await fetch("api/logs", { cache: "no-store" })).json();
    const sel = $("src"), had = sel.value;
    sel.textContent = "";
    for (const l of list) { const o = document.createElement("option"); o.value = l.id; o.textContent = l.label; sel.append(o); }
    if (!list.some(l => l.id === src)) { const o = document.createElement("option"); o.value = src; o.textContent = src; sel.append(o); }
    sel.value = src;
    $("src-field").hidden = list.length < 2 && src === "game";
    if (!had) { const opt = [...sel.options].find(o => o.value === src); if (opt) document.querySelector("h1").textContent = opt.textContent; }
  } catch { }
}
$("src").onchange = e => switchTo(e.target.value);
setInterval(loadSources, 15000);   // plugin logs appear when the game starts
// #16 (a group member's log on the relay): the whole files, on request; the member decides in their app
const RELAY_PAGE = document.documentElement.dataset.relay === "1";
const MEMBER = (location.pathname.match(/^\/s\/([^/]+)\//) || [])[1] || "";
async function fullStatus() {
  try {
    const f = await (await fetch("api/full-logs", { cache: "no-store" })).json();
    const el = $("full-status");
    if (f.ready) {
      const mb = (f.size / 1048576).toFixed(1);
      el.textContent = `Full logs ready: ${mb} MB, sent ${new Date(f.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` + (f.from ? ` (asked by ${f.from})` : "") + ". Kept for an hour.";
    } else if (f.pending) el.textContent = `Asked${f.by ? " by " + f.by : ""}. Waiting for them to send their full logs…`;
    else if (f.declined) el.textContent = "They chose not to send their full logs.";
    else el.textContent = "This view keeps the newest lines. For the whole log files, ask them: their app asks them first.";
    $("full-dl").hidden = !f.ready;
    $("full-ask").hidden = f.pending;
  } catch { }
}
if (RELAY_PAGE && MEMBER) {
  $("full").hidden = false;
  $("full-ask").onclick = async () => {
    $("full-ask").disabled = true;
    try {
      const r = await fetch("/api/full-logs/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: decodeURIComponent(MEMBER) }) });
      if (!r.ok) { const b = await r.json().catch(() => ""); $("full-status").textContent = typeof b === "string" && b ? b : "That didn't work. Try again."; }
      else await fullStatus();
    } catch { $("full-status").textContent = "The group is not answering."; }
    finally { $("full-ask").disabled = false; }
  };
  fullStatus();
  setInterval(fullStatus, 5000);
}
setDownload();
loadSources();
rebuild();
connect();
</script>
</body></html>
