# Release: push a tag v<version> (= <Version> in src/FSPerf.csproj) -> build on a clean Windows machine, smoke-test,
# package, and publish a GitHub Release with the zip and its SHA256. A release tag is the ONLY trigger (Nick 2026-11-09:
# CI runs for published releases only; no branch pushes, no manual runs).
# The full self-test (test/selftest.ps1) runs on a desktop PC before tagging: it starts tray apps and a capture session.
#
# Security: the build job only reads the repository; only the small publish job (tags only) may write, and it runs no
# third-party code but download-artifact. Actions are pinned to commits. The tag reaches scripts only through an
# environment variable (never pasted into script text) and must look exactly like v1.2.3.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      TAG: ${{ github.ref_name }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73   # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Version (and, for a tag, that it matches)
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/FSPerf.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:IS_TAG -eq 'true') {
            if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'a release tag must look like v1.2.3' }
            if ($env:TAG -ne "v$v") { throw ('tag {0} but src/FSPerf.csproj says {1}' -f $env:TAG, $v) }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (native program, starter, PresentMon pinned by hash)
        shell: powershell   # Windows PowerShell 5.1, as on players' and developers' PCs
        run: ./build.ps1 -Publish -FetchPresentMon

      - name: Smoke test the published program
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $help = & publish/SVSPerfMonitor.com --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch 'SVS Performance Monitor') { throw "--help failed" }
          $j = & publish/SVSPerfMonitor.com --once --pid $PID --no-frames 2>$null | ConvertFrom-Json
          if (-not $j.attached -or $j.pid -ne $PID) { throw "--once did not attach to the test process" }
          $s = & publish/SVSPerfMonitor.exe --once --pid $PID --no-frames 2>$null | ConvertFrom-Json
          if (-not $s.attached) { throw "the starter did not pass the command line through" }
          $v = (Get-Item publish/SVSPerfMonitor.exe).VersionInfo
          if ($v.ProductName -ne 'SVS Performance Monitor' -or $v.CompanyName -ne 'SimVizion Studios') { throw "starter version info: $($v.ProductName) / $($v.CompanyName)" }
          "smoke test ok: $($v.ProductName) $($v.ProductVersion)"

      - name: Package
        shell: powershell
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: SVSPerfMonitor
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release; nothing else in this job
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: SVSPerfMonitor
          path: dist

      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          zip="dist/SVSPerfMonitor-${VERSION}.zip"
          sha="$(cut -d' ' -f1 "${zip}.sha256")"
          notes="$(printf '%s\n' \
            "**SVS Performance Monitor ${VERSION}** - shows what limits Farming Simulator 25 on your PC." \
            "" \
            "**Download:** SVSPerfMonitor-${VERSION}.zip below. Unzip it anywhere, keep the files together, double-click **SVSPerfMonitor.exe**. README.txt in the zip explains the rest." \
            "" \
            "The program is not signed yet: if Windows says \"Windows protected your PC\", click *More info*, then *Run anyway*." \
            "" \
            "SHA256 of the zip: \`${sha}\`")"
          gh release create "${TAG}" "${zip}" "${zip}.sha256" --title "SVS Performance Monitor ${VERSION}" --notes "${notes}"
