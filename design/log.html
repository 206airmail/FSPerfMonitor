<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>SVS Performance Monitor · Game log</title><link rel="icon" href="icons/app.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><script defer src="fixtures.js"></script><script defer src="app.js"></script></head>
<body class="log-page" data-page="log"><a class="skip" href="#main">Skip to content</a>
<header class="masthead"><div class="wrap header-inner"><a class="identity" href="dashboard.html"><img src="icons/app.svg" alt="" width="40" height="40"><div><div class="product">SVS Performance Monitor</div><div class="studio">SimVizion Studios</div></div></a><nav aria-label="Main navigation"><a href="dashboard.html">Dashboard</a><a href="settings.html">Settings</a><a href="log.html" aria-current="page">Game log</a></nav></div></header>
<main id="main" class="wrap "><div class="page-title"><h1>Game log</h1><span class="status" id="log-status" role="status"></span></div><div class="log-tools"><label for="filter" class="small">Find text in the log</label><input id="filter" type="search" placeholder="Filter lines…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row between"><div class="filters"><button id="bErr" aria-pressed="false">Errors</button><button id="bWarn" aria-pressed="false">Warnings</button><button id="bFail" aria-pressed="false">FAIL</button></div><div class="actions"><button id="pause" aria-pressed="false">Pause</button><button id="clear">Clear</button></div></div><p class="meta">Selected levels are combined. Text ignores letter case. Clear affects this view only.</p></div><div class="log-viewport" id="log" role="region" aria-label="Game log lines" tabindex="0"></div><div class="log-bottom"><span class="meta" id="log-count"></span><button class="primary" id="jump" hidden>Jump to live ↓</button></div></main>

<aside class="preview" aria-label="Design preview controls"><div class="wrap row"><span class="caption">Design preview · sample data</span><label for="log-state">Scenario</label><select id="log-state"><option value="live">Live · sample lines</option><option value="paused">Paused</option><option value="scrolled">Reading older lines</option><option value="reconnecting">Reconnecting</option><option value="waiting">Waiting for lines</option><option value="restart">Game restarted</option><option value="gap">Lines were missed</option></select><label for="theme">Appearance</label><select id="theme"><option value="system">Use device setting</option><option value="dark">Dark</option><option value="light">Light (proposed)</option></select><a href="tray.html">Tray preview</a><a href="welcome.html">Welcome preview</a></div></aside>
<div class="toast" id="toast" role="status" hidden><button aria-label="Dismiss message" id="dismiss">×</button><span id="toast-text"></span></div></body></html>
